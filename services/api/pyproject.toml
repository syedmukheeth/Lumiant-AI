[project]
name = "lumiant-api"
version = "0.1.0"
description = "Lumiant inventory intelligence platform — API service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.0.55,<2.1",
  "duckdb>=1.5.6,<1.6",
  "duckdb-engine==0.17.0",
  "sqlglot>=30.25,<31",
  "alembic>=1.20,<1.21",
  "pyjwt[crypto]>=2.15,<3",
  "pyyaml>=6.0.3,<7",
  "anthropic>=1,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# PostgreSQL for the app metadata database in production. NOT tested here (no local PostgreSQL).
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
lumiant-synthetic = "lumiant.synthetic.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "httpx>=0.28,<0.29",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "types-PyYAML",
  "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumiant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "security: security-focused tests",
  "integration: tests that run against generated synthetic warehouses",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608", "E501", "N817"]
"src/lumiant/synthetic/**" = ["S311"]
"src/lumiant/analyses/risks.py" = ["E501"]
"src/lumiant/admin/service.py" = ["E501"]
"src/lumiant/agent/*.py" = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["lumiant"]

[[tool.mypy.overrides]]
module = ["duckdb_engine.*", "sqlglot.*"]
ignore_missing_imports = true
