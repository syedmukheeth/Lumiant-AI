- {user: alpha.admin, question: "How has inventory value changed over the last 12 months?", tools: [value_trend], expect: answer}
- {user: alpha.admin, question: "Show issues month by month for the last 6 months", tools: [value_trend, query_inventory], expect: answer}
- {user: delta.admin, question: "Did our inventory value go up or down since May?", tools: [value_trend], expect: answer}
- {user: alpha.admin, question: "How old is the stock in warehouse 2100?", tools: [stock_ageing, dormant], expect: answer}
- {user: alpha.admin, question: "By how much did inventory value change between the first and last month of the trend?", tools: [value_trend, calculate], expect: answer}

