# Live Analyst eval (S11): run against the REAL external provider on synthetic tenants only.
#   LUMIANT_AGENT_PROVIDER=gemini LUMIANT_GEMINI_API_KEY=... uv run python eval/analyst_live.py
# Each case: who asks, the question, and what a good answer does.
#   tools: at least one of these tools must be called (any order)
#   expect: answer (figures traced to results) | decline (says the data cannot answer; no figures invented)
# Scoring: tool choice, grounding passed, model wording used (not the template fallback), honest decline.

# Business goals and open questions
- {user: alpha.admin, question: "What should I do to make 200000 profit next month?", tools: [inventory_levers], expect: answer}
- {user: alpha.admin, question: "How can we free up cash from our inventory?", tools: [inventory_levers], expect: answer}
- {user: alpha.admin, question: "Where is money tied up that we could release this quarter?", tools: [inventory_levers, excess_stock, dormant], expect: answer}
- {user: alpha.admin, question: "Give me three actions to cut inventory carrying cost", tools: [inventory_levers], expect: answer}
- {user: alpha.admin, question: "How are we doing overall? Anything I should worry about?", tools: [insights, inventory_levers], expect: answer}
- {user: alpha.admin, question: "If we cleared all excess stock, what share of 200000 would that be?", tools: [calculate], expect: answer}
- {user: delta.admin, question: "Which open orders have the best margin and are they at risk?", tools: [customer_commitment, order_fulfilment, query_inventory], expect: answer}
- {user: beta.admin, question: "How much could we save by clearing dormant stock in each currency?", tools: [inventory_levers, dormant], expect: answer}
- {user: alpha.analyst, question: "How can we improve working capital?", tools: [inventory_levers], expect: answer}
- {user: gamma.admin, question: "What would improve our inventory position most?", tools: [inventory_levers, data_quality], expect: answer}

