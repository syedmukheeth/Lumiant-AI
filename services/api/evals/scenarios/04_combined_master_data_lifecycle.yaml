- id: Q-1
  title: Combined question - orders, short material, slow supplier, approved alternative
  persona: order planner
  today: 2026-12-01
  data: {}
  checks:
    - run: assess
      params:
        question: >-
          We have three open customer orders. One raw material is insufficient, our preferred supplier has a long
          lead time and we have an approved alternative material. Give me the best fulfilment plan.
        available: {demand: 3, stock: 10, boms: 2, supply: 1, lead_times: 5, alternates: 1, offers: 4, suppliers: 3}
      expect: {mode: full, capabilities: [order_fulfilment, material_requirements, substitution, supplier_comparison]}
    - run: assess
      params: {question: what is the weather tomorrow, available: {stock: 10}}
      expect: {mode: clarify}
