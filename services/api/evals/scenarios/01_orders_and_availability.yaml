- id: S82
  title: Order units converted to the base unit; unknown unit is not aggregated
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1, uom: EA}]
    conversions: [{from: BOX, to: EA, factor: 12}]
    stock: [{item: FG1, qty: 100, uom: EA}]
    demand:
      - {order: SO20, item: FG1, qty: 5, uom: BOX, due: 2026-12-05}
      - {order: SO21, item: FG1, qty: 3, uom: DRUM, due: 2026-12-05}
  checks:
    - run: mrp
      expect:
        fulfilment: {SO20/1: {from_stock: 60, on_time: true}}
        gross: {FG1: 60}
        issues: [missing_uom_conversion]

- id: S52
  title: Lot sizing - minimum lot and multiple create visible excess
  persona: procurement manager
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: RM1}]
    policies: [{item: RM1, lead_days: 5, min_lot: 50, multiple: 10}]
    demand:
      - {order: SO30, line: 1, item: RM1, qty: 13, due: 2026-12-10}
      - {order: SO30, line: 2, item: RM1, qty: 10, due: 2026-12-10}
  checks:
    - run: mrp
      expect:
        planned: {RM1: {qty: 50, net: 23, count: 1}}
        excess: {RM1: 27}
