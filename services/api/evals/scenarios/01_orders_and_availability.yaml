# Customer orders and inventory availability (docs/SCENARIO_CATALOGUE.md, scenarios 1–16).
# Synthetic, fictional records. Unless a scenario tests the calendar, every day is a working day so dates are easy
# to verify by hand. Planning date 2026-12-01.

- id: S01
  title: Full order fulfilment from usable stock
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    stock: [{item: FG1, qty: 120}]
    demand: [{order: SO1, item: FG1, qty: 100, due: 2026-12-05, customer: C1}]
  checks:
    - run: mrp
      expect:
        fulfilment: {SO1/1: {from_stock: 100, from_planned: 0, on_time: true, ready: 2026-12-01}}
        no_planned: [FG1]

- id: S02
  title: Partial availability, replenishment in time
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    stock: [{item: FG1, qty: 300}]
    policies: [{item: FG1, lead_days: 10}]
    demand: [{order: SO2, item: FG1, qty: 500, due: 2026-12-20, customer: C1}]
  checks:
    - run: mrp
      expect:
        fulfilment: {SO2/1: {from_stock: 300, from_planned: 200, on_time: true, ready: 2026-12-20}}
        planned: {FG1: {qty: 200, action: buy, release: 2026-12-10, need: 2026-12-20}}

- id: S02b
  title: Partial availability, replenishment too late
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    stock: [{item: FG1, qty: 300}]
    policies: [{item: FG1, lead_days: 30}]
    demand: [{order: SO2, item: FG1, qty: 500, due: 2026-12-20, customer: C1}]
  checks:
    - run: mrp
      expect:
        fulfilment: {SO2/1: {from_stock: 300, from_planned: 200, on_time: false, ready: 2026-12-31, late_days: 11, reasons_contain: "earliest ready 2026-12-31"}}
        issues: [release_overdue]

- id: S03
  title: Competing orders, allocation by due date then priority
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    stock: [{item: FG1, qty: 100}]
    policies: [{item: FG1, lead_days: 5}]
    demand:
      - {order: SO1, item: FG1, qty: 60, due: 2026-12-10, priority: 5, customer: C1}
      - {order: SO2, item: FG1, qty: 60, due: 2026-12-08, priority: 5, customer: C2}
      - {order: SO3, item: FG1, qty: 60, due: 2026-12-10, priority: 1, customer: C3}
  checks:
    - run: mrp
      expect:
        fulfilment:
          SO2/1: {from_stock: 60, on_time: true}
          SO3/1: {from_stock: 40, from_planned: 20}
          SO1/1: {from_stock: 0, from_planned: 60}

- id: S03b
  title: Competing orders, tenant policy allocates by customer priority first
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    allocation: {keys: [priority, due]}
    items: [{id: FG1}]
    stock: [{item: FG1, qty: 100}]
    policies: [{item: FG1, lead_days: 5}]
    demand:
      - {order: SO1, item: FG1, qty: 60, due: 2026-12-10, priority: 5, customer: C1}
      - {order: SO2, item: FG1, qty: 60, due: 2026-12-08, priority: 5, customer: C2}
      - {order: SO3, item: FG1, qty: 60, due: 2026-12-10, priority: 1, customer: C3}
  checks:
    - run: mrp
      expect:
        fulfilment:
          SO3/1: {from_stock: 60}
          SO2/1: {from_stock: 40, from_planned: 20}
          SO1/1: {from_stock: 0}

- id: S05
  title: Customer increases a confirmed order (no double counting)
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    stock: [{item: FG1, qty: 120}]
    policies: [{item: FG1, lead_days: 5}]
    # The order now reads 150 (was 100): demand is the current state of the order, never original + change.
    demand: [{order: SO5, item: FG1, qty: 150, due: 2026-12-15, customer: C1}]
  checks:
    - run: mrp
      expect:
        gross: {FG1: 150}
        planned: {FG1: {qty: 30}}

- id: S06
  title: Customer cancels after a purchase order was placed
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    supply: [{ref: PO-1, item: FG1, qty: 200, due: 2026-12-10}]
    demand: [{order: SO9, item: FG1, qty: 50, due: 2026-12-15, customer: C2}]
  checks:
    - run: mrp
      expect:
        fulfilment: {SO9/1: {from_receipts: 50, on_time: true}}
        excess: {FG1: 150}
        no_planned: [FG1]

- id: S07
  title: Order lines with different delivery dates (time-phased)
  persona: order planner
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    stock: [{item: FG1, qty: 50}]
    supply: [{ref: PO-1, item: FG1, qty: 100, due: 2026-12-10}]
    demand:
      - {order: SO7, line: 1, item: FG1, qty: 40, due: 2026-12-05, customer: C1}
      - {order: SO7, line: 2, item: FG1, qty: 40, due: 2026-12-08, customer: C1}
      - {order: SO7, line: 3, item: FG1, qty: 60, due: 2026-12-12, customer: C1}
  checks:
    - run: mrp
      expect:
        fulfilment:
          SO7/1: {from_stock: 40, on_time: true}
          SO7/2: {from_stock: 10, from_receipts: 30, on_time: false, ready: 2026-12-10, late_days: 2, reasons_contain: "PO-1"}
          SO7/3: {from_receipts: 60, on_time: true}
        no_planned: [FG1]

- id: S08
  title: Partial delivery now, backorder from an open purchase order
  persona: order planner
