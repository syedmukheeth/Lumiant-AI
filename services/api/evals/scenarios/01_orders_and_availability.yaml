    demand: [{order: SO8, item: FG1, qty: 80, due: 2026-12-05, customer: C1}]
  checks:
    - run: mrp
      expect:
        fulfilment: {SO8/1: {from_stock: 30, from_receipts: 50, on_time: false, ready: 2026-12-15}}
