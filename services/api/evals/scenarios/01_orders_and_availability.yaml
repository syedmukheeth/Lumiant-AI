- id: S10
  title: Returns, inspection and blocked stock are not available
  persona: warehouse manager
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    policies: [{item: FG1, lead_days: 3}]
    stock:
      - {item: FG1, qty: 50, status: unrestricted}
      - {item: FG1, qty: 20, status: returns}
      - {item: FG1, qty: 10, status: quality_inspection}
      - {item: FG1, qty: 5, status: blocked}
    demand: [{order: SO10, item: FG1, qty: 70, due: 2026-12-05}]
  checks:
    - run: mrp
      expect:
        usable: {FG1: 50}
        not_usable: {FG1: {returns: 20, quality_inspection: 10, blocked: 5}}
        fulfilment: {SO10/1: {from_stock: 50, from_planned: 20}}

- id: S11
  title: Stock present but reserved
  persona: warehouse manager
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    policies: [{item: FG1, lead_days: 3}]
    stock: [{item: FG1, qty: 100}]
    reservations: [{item: FG1, qty: 30, ref: RES-1}]
    demand: [{order: SO11, item: FG1, qty: 80, due: 2026-12-05}]
  checks:
    - run: mrp
      expect:
        fulfilment: {SO11/1: {from_stock: 70, from_planned: 10}}

- id: S11b
  title: Expired and customer-owned stock is not available
  persona: warehouse manager
  today: 2026-12-01
  data:
    calendar: {weekend: []}
    items: [{id: FG1}]
    policies: [{item: FG1, lead_days: 2}]
    stock:
      - {item: FG1, qty: 40, lot: L-OLD, expiry: 2026-11-30}
      - {item: FG1, qty: 20, lot: L-NEW, expiry: 2027-06-30}
      - {item: FG1, qty: 25, owner: customer}
    demand: [{order: SO12, item: FG1, qty: 50, due: 2026-12-05}]
  checks:
    - run: mrp
      expect:
        usable: {FG1: 20}
        not_usable: {FG1: {expired: 40, customer-owned: 25}}
        planned: {FG1: {qty: 30}}

