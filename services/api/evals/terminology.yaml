# Terminology questions: the same analyses asked in SAP, Odoo and Oracle Fusion words, plain English and Arabic.
# Expected routing for the built-in matcher (lumiant.agent.terminology). Run with:
#   uv run pytest tests/integration/test_agent.py -k terminology
# Optional keys: args (must match the first tool call), kind (unsupported/clarify), forbid (must not appear anywhere).

