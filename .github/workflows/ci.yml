# Continuous integration. Mirrors the commands verified on Linux (docs/06-operations/TESTING.md, docs/logs/TEST_RUNS.md).
# Validated with actionlint; NOT YET RUN on GitHub Actions itself. If a first run fails, fix the workflow, not the tests.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Dependency audit
        run: |
          uv export --no-hashes --format requirements-txt --no-emit-project > "$RUNNER_TEMP/req.txt"
          uvx pip-audit -r "$RUNNER_TEMP/req.txt"

  api-postgres-redis:
    # The same API suite on PostgreSQL (app/audit DB) plus the Redis-backed rate limiter tests.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumiant
          POSTGRES_PASSWORD: lumiant_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumiant" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LUMIANT_TEST_PG_ADMIN_URL: postgresql+psycopg://lumiant:lumiant_test@localhost:5432/postgres
      LUMIANT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra postgres --extra redis
      - name: Alembic migration on PostgreSQL
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
        env:
          LUMIANT_APP_DB_URL: postgresql+psycopg://lumiant:lumiant_test@localhost:5432/postgres
      - run: uv run pytest -q -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4 # pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen
        working-directory: services/api
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm e2e
        working-directory: apps/web

  docker:
    # Builds both images and runs the demo stack (synthetic data, dev sign-in), then checks the web app and the API through it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/login -o /dev/null
          curl -fsS http://localhost:3000/api/health
          curl -fsS -c jar -H 'X-Requested-With: lumiant' -H 'Content-Type: application/json' \
            -d '{"username":"alpha.admin"}' http://localhost:3000/api/auth/dev-login -o /dev/null
          curl -fsS -b jar http://localhost:3000/api/auth/me | grep -q alpha.admin
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
