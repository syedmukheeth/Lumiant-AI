# Continuous integration. NOT YET RUN on GitHub: written to mirror the commands verified locally
# (docs/06-operations/TESTING.md). If a first run fails, fix the workflow, not the tests.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Dependency audit
        run: |
          uv export --no-hashes --format requirements-txt --no-emit-project > "$RUNNER_TEMP/req.txt"
          uvx pip-audit -r "$RUNNER_TEMP/req.txt"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen
        working-directory: services/api
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm e2e
        working-directory: apps/web
